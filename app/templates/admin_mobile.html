<!doctype html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Szwalnia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="manifest" href="{{ url_for('static', filename='mobile_assets/manifest_admin.json') }}">
    <meta name="theme-color" content="#ffc107">
    <style>


        body { padding-bottom: 70px; } /* Miejsce na dolne menu */
        .nav-link { font-size: 0.75rem; }

        /* Centrowanie ikon i tekstu w linkach nawigacji dolnej */
        .navbar.fixed-bottom .nav-link {
            text-align: center; /* Centruje zawartość (ikonę i tekst) wewnątrz linku */
            width: auto;      /* Pozwala linkowi dopasować szerokość do zawartości */
            flex-grow: 1;      /* Pozwala linkom równomiernie zająć przestrzeń */
        }

        /* --- NOWY STYL DLA PASKA STATUSU --- */
        .server-status-bar {
            font-size: 0.7rem; /* Mniejsza czcionka */
            padding: 4px 15px; /* Mniejszy padding */
            background-color: #495057; /* Ciemniejsze tło */
            border-bottom: 1px solid #6c757d;
            text-align: center;
            position: sticky; /* Przyklejony pod nagłówkiem */
            top: 56px; /* Wysokość nagłówka */
            z-index: 999; /* Pod nagłówkiem, nad resztą treści */
        }
        .server-status-bar .badge {
            font-size: 0.65rem; /* Jeszcze mniejsza czcionka w badge */
        }
        /* --- KONIEC NOWEGO STYLU --- */

    </style>
</head>
<body>
    <div class="header bg-dark text-white p-3 text-center fs-5 position-sticky top-0" style="z-index: 1000; height: 56px;"> 
        Admin
        <span id="app-version" style="font-size: 0.6em; opacity: 0.8; font-weight: normal;"></span>
    </div>

    
    <div class="server-status-bar text-white-50">
        <span class="me-3">
            DRUK:
            <span id="print-server-status" class="badge">
                <i class="bi bi-question-circle"></i> Sprawdzanie...
            </span>
        </span>
        <span>
            SYNC:
            <span id="sync-server-status" class="badge">
                <i class="bi bi-question-circle"></i> Sprawdzanie...
            </span>
        </span>
    </div>
    


    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
        <div id="updateToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
            <div class="toast-header">
                <strong class="me-auto text-dark"><i class="bi bi-arrow-down-circle-fill text-success"></i> Dostępna aktualizacja</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body text-info">
                Nowa wersja aplikacji jest gotowa. Odśwież, aby załadować.
                <button class="btn btn-success btn-sm w-100 mt-2" id="refresh-button">Odśwież teraz</button>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-3" id="app-content">
        
    </div>

    <nav class="navbar navbar-dark bg-dark fixed-bottom">
        <div class="container-fluid d-flex justify-content-around">
            <a class="nav-link text-warning active" href="#" id="nav-kokpit"><i class="bi bi-speedometer2 d-block fs-3"></i>Kokpit</a>
            <a class="nav-link text-white" href="#" id="nav-produkcja"><i class="bi bi-diagram-3 d-block fs-3"></i>Produkcja</a>
            <a class="nav-link text-white" href="#" id="nav-historia"><i class="bi bi-archive d-block fs-3"></i>Historia</a>
            <a class="nav-link text-white" href="#" id="nav-dodaj"><i class="bi bi-plus-circle d-block fs-3"></i>Dodaj</a>
            <a class="nav-link text-white" href="#" id="nav-kalkulator"><i class="bi bi-calculator d-block fs-3"></i>Kalkulator</a>
            <a class="nav-link text-white" href="#" id="nav-ceny"><i class="bi bi-tags d-block fs-3"></i>Ceny</a>
            <a class="nav-link text-white" href="#" id="nav-produkty"><i class="bi bi-box-seam d-block fs-3"></i>Produkty</a>
        </div>
    </nav>

    <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orderDetailsModalLabel">Ładowanie...</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="orderDetailsModalBody">
                    <p class="text-center">Ładowanie szczegółów...</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Zamknij</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark">
          <div class="modal-header border-secondary">
            <h5 class="modal-title text-light" id="imageModalLabel">Podgląd zdjęcia produktu</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center p-0">
            <img src="" id="fullImage" class="img-fluid" alt="Powiększone zdjęcie produktu">
          </div>
        </div>
      </div>
    </div>

    <template id="calc-fabric-row-template">
        <div class="row gx-2 align-items-center mb-2 calc-fabric-row" data-price="0.0">
            <div class="col-5"><select class="form-select form-select-sm calc-item-select"></select></div>
            <div class="col-4"><select class="form-select form-select-sm calc-supplier-select" disabled><option value="default">-- Dostawca --</option></select></div>
            <div class="col-2"><input type="number" class="form-control form-control-sm calc-item-usage calc-calc-input" placeholder="m" value="0.0" step="0.01"></div>
            <div class="col-1"><button type="button" class="btn btn-danger btn-sm calc-remove-btn p-1"><i class="bi bi-trash"></i></button></div>
        </div>
    </template>
    <template id="calc-material-row-template">
         <div class="row gx-2 align-items-center mb-2 calc-material-row" data-price="0.0">
            <div class="col-5"><select class="form-select form-select-sm calc-item-select"></select></div>
            <div class="col-4"><select class="form-select form-select-sm calc-supplier-select" disabled><option value="default">-- Dostawca --</option></select></div>
            <div class="col-2"><input type="text" class="form-control form-control-sm calc-item-usage calc-calc-input" placeholder="Ilość" value="1"></div>
            <div class="col-1"><button type="button" class="btn btn-danger btn-sm calc-remove-btn p-1"><i class="bi bi-trash"></i></button></div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', () => {

    const content = document.getElementById('app-content');
    const navLinks = document.querySelectorAll('.nav-link');
    const navKokpit = document.getElementById('nav-kokpit');
    const navProdukcja = document.getElementById('nav-produkcja');
    const navHistoria = document.getElementById('nav-historia');
    const navDodaj = document.getElementById('nav-dodaj');
    const navCeny = document.getElementById('nav-ceny');
    const navProdukty = document.getElementById('nav-produkty');
    const navKalkulator = document.getElementById('nav-kalkulator');

    const detailsModal = new bootstrap.Modal(document.getElementById('orderDetailsModal'));
    const modalTitle = document.getElementById('orderDetailsModalLabel');
    const modalBody = document.getElementById('orderDetailsModalBody');

    // === NOWE ZMIENNE DLA STATUSU SERWERÓW ===
    const printStatusBadge = document.getElementById('print-server-status');
    const syncStatusBadge = document.getElementById('sync-server-status');
    // === KONIEC NOWYCH ZMIENNYCH ===

    let templatesCache = [];
    let historyPage = 1;
    let historyLoading = false;

    // Nasłuchuj wiadomości od Service Workera (wersja)
    navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'VERSION_RESPONSE') {
            console.log('[PWA] Otrzymano odpowiedź z wersją:', event.data.version);
            const versionSpan = document.getElementById('app-version');
            if (versionSpan) {
                versionSpan.textContent = `${event.data.version}`;
            }
        }
    });

    // Poproś o wersję, gdy SW będzie gotowy
    navigator.serviceWorker.ready.then(readyReg => {
        if (readyReg.active) {
            console.log('[PWA] Wysyłanie zapytania o wersję do SW...');
            readyReg.active.postMessage({ type: 'GET_VERSION' });
        }
    });

    // Zmienne dla zakładki Produkty
    let currentProductId = null;
    let imagesToUpload = [];

    // --- NAWIGACJA ---
    function setActiveNav(activeLink) {
        navLinks.forEach(link => {
            link.classList.remove('active', 'text-warning');
            link.classList.add('text-white');
        });
        activeLink.classList.add('active', 'text-warning');
        activeLink.classList.remove('text-white');
    }

    navKokpit.addEventListener('click', (e) => { e.preventDefault(); setActiveNav(navKokpit); loadKokpit(); });
    navProdukcja.addEventListener('click', (e) => { e.preventDefault(); setActiveNav(navProdukcja); loadProdukcja(); });
    navHistoria.addEventListener('click', (e) => { e.preventDefault(); setActiveNav(navHistoria); loadHistoria(true); });
    navDodaj.addEventListener('click', (e) => { e.preventDefault(); setActiveNav(navDodaj); loadDodaj(); });
    navCeny.addEventListener('click', (e) => { e.preventDefault(); setActiveNav(navCeny); loadCeny(); });
    navProdukty.addEventListener('click', (e) => { e.preventDefault(); setActiveNav(navProdukty); loadProdukty(); });
    navKalkulator.addEventListener('click', (e) => { e.preventDefault(); setActiveNav(navKalkulator); loadKalkulator(); });

    // --- OBSŁUGA KLIKNIĘĆ W ZLECENIA ---
    document.body.addEventListener('click', (e) => {
        const orderCard = e.target.closest('[data-order-id]');
        if (orderCard) {
            e.preventDefault();
            const orderId = orderCard.dataset.orderId;
            showOrderDetails(orderId);
        }
    });

    // --- FUNKCJA POBIERANIA SZCZEGÓŁÓW ZLECENIA ---
    async function showOrderDetails(orderId) {
        modalTitle.textContent = 'Ładowanie...';
        modalBody.innerHTML = '<p class="text-center">Pobieranie danych...</p>';
        detailsModal.show();

        try {
            const response = await fetch(`/api/admin/order_details/${orderId}`);
            if (!response.ok) throw new Error('Błąd sieci lub serwera');
            const data = await response.json();

            modalTitle.textContent = `Szczegóły: ${data.order_code}`;

            let productsHtml = data.products.length > 0 ? '' : '<p>Brak produktów na tym zleceniu.</p>';
            data.products.forEach(p => {
                productsHtml += `<li class="list-group-item d-flex justify-content-between"><span>${p.name} [${p.size}]</span><span class="badge bg-primary rounded-pill">${p.quantity} szt.</span></li>`;
            });

            let fabricsHtml = data.fabrics.length > 0 ? '' : '<p class="text-muted small">Brak tkanin dodanych ręcznie.</p>';
            data.fabrics.forEach(f => {
                fabricsHtml += `<li class="list-group-item">${f}</li>`;
            });

            modalBody.innerHTML = `
                <p><strong>Klient:</strong> ${data.client_name}<br><strong>Status:</strong> <span class="badge bg-info">${data.status}</span><br><strong>Termin:</strong> ${data.deadline}<br><strong>Suma sztuk:</strong> ${data.total_quantity}</p><hr>
                <h5>Opis zlecenia</h5><p>${data.description || 'Brak opisu.'}</p>
                <h5 class="mt-3">Uwagi (biuro)</h5><div class="card card-body bg-secondary text-white small">${data.uwagi || 'Brak uwag.'}</div>
                <h5 class="mt-3">Uwagi (krojownia)</h5><div class="card card-body bg-dark text-white small">${data.uwagi_krojowni || 'Brak uwag.'}</div>
                <h5 class="mt-3">Produkty</h5><ul class="list-group list-group-flush">${productsHtml}</ul>
                <h5 class="mt-3">Tkaniny ręczne</h5><ul class="list-group list-group-flush small">${fabricsHtml}</ul>`;

        } catch (err) {
            modalTitle.textContent = 'Błąd';
            modalBody.innerHTML = `<div class="alert alert-danger">Nie udało się załadować szczegółów: ${err.message}</div>`;
        }
    }

    // --- WIDOKI ---

    // 1. KOKPIT
    async function loadKokpit() {
        content.innerHTML = `<h2 class="text-warning">Kokpit 📈</h2><p>Ładowanie...</p>`;
        try {
            const response = await fetch('/api/admin/kpi');
            if (!response.ok) {
                throw new Error(`Błąd sieci: ${response.status}`);
            }
            const data = await response.json();

            // Funkcja pomocnicza do renderowania rozwijanej listy zleceń
            function renderCollapsibleOrderList(orders, cardElementId, listId, initialVisible = 5) {
                const cardBody = document.getElementById(cardElementId);
                if (!cardBody || !orders) return;

                let listHtml = `<div class="mt-2 pt-2 border-top border-white border-opacity-25 order-list-container small">`;

                if (orders.length > 0) {
                    listHtml += `<ul class="list-unstyled mb-0" id="${listId}">`;
                    orders.forEach((o, index) => {
                        const hiddenClass = index >= initialVisible ? 'd-none' : '';
                        listHtml += `
                            <li class="${hiddenClass}">
                                <a href="#" class="text-white text-decoration-none d-flex justify-content-between align-items-center py-1 kokpit-order-link" data-order-id="${o.id}" title="${o.code || ''} - ${o.client || ''}">
                                    <span class="flex-grow-1 me-2">${o.code || 'Brak kodu'} - ${o.client || 'Brak klienta'}</span>
                                    <i class="bi bi-box-arrow-up-right"></i>
                                </a>
                            </li>`;
                    });
                    listHtml += `</ul>`;
                    if (orders.length > initialVisible) {
                        listHtml += `<button class="btn btn-sm btn-outline-light w-100 mt-2 toggle-order-list-btn" data-target="${listId}" data-visible="${initialVisible}">Pokaż więcej (${orders.length - initialVisible})</button>`;
                    }
                } else {
                    listHtml += `<p class="text-white-50 small mb-0">Brak zleceń.</p>`;
                }
                listHtml += `</div>`;
                cardBody.insertAdjacentHTML('beforeend', listHtml);
            }

            // Główny HTML kokpitu
            content.innerHTML = `
                <h2 class="text-warning mb-4">Kokpit 📈</h2>
                <div class="card text-bg-light mb-3">
                    <div class="card-header">Obrót w tym miesiącu</div>
                    <div class="card-body">
                        <h class="card-title fs-3">${data.monthly_turnover !== undefined ? data.monthly_turnover.toFixed(2) : 'B/D'} zł</h3>
                    </div>
                </div>

                <div class="col-12 mb-3">
                    <div class="card text-bg-info">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span>Nowe zlecenia</span>
                            <span class="badge bg-light text-primary rounded-pill">${data.stats_nowe !== undefined ? data.stats_nowe : '?'}</span>
                        </div>
                        <div class="card-body pt-2" id="new-orders-card-body">
                            
                        </div>
                    </div>
                </div>
                <div class="col-12 mb-3">
                    <div class="card text-bg-success">
                         <div class="card-header d-flex justify-content-between align-items-center">
                            <span>W realizacji</span>
                            <span class="badge bg-light text-info rounded-pill">${data.stats_w_realizacji !== undefined ? data.stats_w_realizacji : '?'}</span>
                        </div>
                        <div class="card-body pt-2" id="in-progress-orders-card-body">
                            
                        </div>
                    </div>
                </div>
                `;

            // Wywołaj funkcje renderujące listy
            renderCollapsibleOrderList(data.new_orders || [], 'new-orders-card-body', 'kokpit-new-orders-list');
            renderCollapsibleOrderList(data.in_progress_orders || [], 'in-progress-orders-card-body', 'kokpit-in-progress-orders-list');

            // Obsługa przycisków "Pokaż więcej/mniej"
            document.querySelectorAll('.toggle-order-list-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const targetListId = this.dataset.target;
                    const list = document.getElementById(targetListId);
                    const initialVisible = parseInt(this.dataset.visible, 10);
                    const items = list.querySelectorAll('li');
                    let isExpanded = this.textContent.startsWith('Pokaż mniej');
                    items.forEach((item, index) => {
                        if (index >= initialVisible) {
                            item.classList.toggle('d-none', isExpanded);
                        }
                    });
                    if (isExpanded) { this.textContent = `Pokaż więcej (${items.length - initialVisible})`; }
                    else { this.textContent = 'Pokaż mniej'; }
                });
            });

            // Obsługa linków do zleceń
            document.querySelectorAll('.kokpit-order-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const orderId = this.dataset.orderId;
                    showOrderDetails(orderId);
                });
            });

        } catch (err) {
            console.error("Błąd ładowania danych kokpitu:", err);
            content.innerHTML = `<div class="alert alert-danger">Błąd ładowania danych kokpitu: ${err.message}</div>`;
        }
    }

    // 2. PRODUKCJA
    async function loadProdukcja() {
        content.innerHTML = `<h2 class="text-warning">Produkcja 🏭</h2><p>Ładowanie...</p>`;
        try {
            const response = await fetch('/api/admin/production_overview');
            const data = await response.json();
            let html = `<h2 class="text-warning mb-4">Produkcja 🏭</h2><h4>W Krojowni (${data.krojownia.length})</h4>`;
            if (data.krojownia.length > 0) {
                html += `<div class="list-group mb-4">`;
                data.krojownia.forEach(o => { html += `<a href="#" class="list-group-item list-group-item-action" data-order-id="${o.id}"><div class="d-flex w-100 justify-content-between"><h6 class="mb-1">${o.order_code}</h6><small><span class="badge bg-secondary">${o.cutting_table || 'NOWE'}</span></small></div><p class="mb-1 small">${o.client_name}</p></a>`; });
                html += `</div>`;
            } else { html += `<p class="text-muted">Krojownia jest pusta.</p>`; }
            html += `<h4>W Szwalni (${data.szwalnia.length})</h4>`;
            if (data.szwalnia.length > 0) {
                html += `<div class="list-group mb-4">`;
                data.szwalnia.forEach(o => { html += `<a href="#" class="list-group-item list-group-item-action" data-order-id="${o.id}"><div class="d-flex w-100 justify-content-between"><h6 class="mb-1">${o.order_code}</h6><small><span class="badge bg-info">${o.assigned_team || 'Czeka'}</span></small></div><p class="mb-1 small">${o.client_name}</p></a>`; });
                html += `</div>`;
            } else { html += `<p class="text-muted">Szwalnia czeka na zlecenia.</p>`; }
            content.innerHTML = html;
        } catch (err) {
            content.innerHTML = `<div class="alert alert-danger">Błąd ładowania danych o produkcji.</div>`;
        }
    }

    // 3. HISTORIA
    async function loadHistoria(reload = false, year = null, month = null) {
        const historyListContainerId = 'history-list';
        const loaderContainerId = 'history-loader';
        const yearFilterId = 'historyYearFilter';
        const monthFilterId = 'historyMonthFilter';
        const filterBtnId = 'history-filter-btn';
        const loadMoreBtnId = 'load-more-history-btn';

        let currentYear = year;
        let currentMonth = month;

        if ((reload || (year === null && month === null)) && !historyLoading) {
            const yearFilterElement = document.getElementById(yearFilterId);
            const monthFilterElement = document.getElementById(monthFilterId);
            if (yearFilterElement) { currentYear = yearFilterElement.value; }
            if (monthFilterElement) { currentMonth = monthFilterElement.value; }
        }
        if (currentYear === null) currentYear = new Date().getFullYear();
        if (currentMonth === null) currentMonth = new Date().getMonth() + 1;

        if (reload) {
            historyPage = 1;
            content.innerHTML = `
                <h2 class="text-warning mb-3">Historia 📂</h2>
                <div class="row gx-2 mb-3 align-items-end">
                    <div class="col">
                        <label for="${yearFilterId}" class="form-label form-label-sm">Rok:</label>
                        <select id="${yearFilterId}" class="form-select form-select-sm">
                            <option value="0">Wszystkie</option>
                            </select>
                    </div>
                    <div class="col">
                        <label for="${monthFilterId}" class="form-label form-label-sm">Miesiąc:</label>
                        <select id="${monthFilterId}" class="form-select form-select-sm">
                            <option value="0">Wszystkie</option>
                            ${[...Array(12).keys()].map(i => `<option value="${i+1}">${String(i+1).padStart(2, '0')}</option>`).join('')}
                        </select>
                    </div>
                    <div class="col-auto">
                        <button id="${filterBtnId}" class="btn btn-warning btn-sm">Filtruj</button>
                    </div>
                </div>
                <div id="${historyListContainerId}" class="list-group"></div>
                <div id="${loaderContainerId}" class="text-center py-3"><p>Ładowanie...</p></div>`;

            const filterButton = document.getElementById(filterBtnId);
            if (filterButton) {
                filterButton.replaceWith(filterButton.cloneNode(true)); // Usuń stary listener
                document.getElementById(filterBtnId).addEventListener('click', () => {
                    loadHistoria(true, null, null); // Odczytaj filtry przy kliknięciu
                });
            }
        }

        if (historyLoading) return;
        historyLoading = true;

        const loaderContainer = document.getElementById(loaderContainerId);
        if (loaderContainer) loaderContainer.style.display = 'block'; // Pokaż loader

        const apiUrl = `/api/admin/order_history?page=${historyPage}&year=${currentYear}&month=${currentMonth}`;

        try {
            console.log(`Ładowanie historii: ${apiUrl}`);
            const response = await fetch(apiUrl);
            if (!response.ok) { throw new Error(`Błąd sieci: ${response.status}`); }
            const data = await response.json();

            const listContainer = document.getElementById(historyListContainerId);
            const yearSelect = document.getElementById(yearFilterId);
            const monthSelect = document.getElementById(monthFilterId);

             // Wypełnij listę lat tylko przy pierwszym ładowaniu (reload=true) LUB jeśli select jest pusty
             if (yearSelect && (reload || yearSelect.options.length <= 1) && data.available_years) {
                const currentSelectedYear = yearSelect.value; // Zapamiętaj co było wybrane
                yearSelect.innerHTML = '<option value="0">Wszystkie</option>';
                data.available_years.forEach(y => {
                    yearSelect.innerHTML += `<option value="${y}" ${y == currentYear ? 'selected' : ''}>${y}</option>`;
                });
                // Jeśli odczytany rok nie był na liście z API, dodaj go jako wybraną opcję
                if (currentYear != 0 && !data.available_years.includes(parseInt(currentYear))) {
                    yearSelect.innerHTML += `<option value="${currentYear}" selected>${currentYear}</option>`;
                }
                // Upewnij się, że wartość jest ustawiona poprawnie
                if (yearSelect.value !== String(currentYear)) {
                    yearSelect.value = currentYear;
                }
            } else if (yearSelect && yearSelect.value !== String(currentYear)) {
                 // Jeśli nie przeładowujemy, ale wartość się zmieniła (np. przez API domyślnie), zaktualizuj
                 yearSelect.value = currentYear;
            }

            // Ustaw wybrany miesiąc (zawsze aktualizuj)
            if (monthSelect && monthSelect.value !== String(currentMonth)) {
                 monthSelect.value = currentMonth;
            }


            if (listContainer && historyPage === 1) { listContainer.innerHTML = ''; } // Wyczyść listę przy przeładowaniu

            if (listContainer && data.orders.length > 0) {
                data.orders.forEach(o => { listContainer.innerHTML += `<a href="#" class="list-group-item list-group-item-action" data-order-id="${o.id}"><div class="d-flex w-100 justify-content-between"><h6 class="mb-1">${o.order_code}</h6><small class="text-muted">${o.finished_date}</small></div><p class="mb-1 small">${o.client_name}</p></a>`; });
            } else if (listContainer && historyPage === 1) {
                listContainer.innerHTML = '<p class="text-center text-muted mt-3">Brak zleceń spełniających kryteria.</p>';
            }

            // Usuń stary przycisk "Wczytaj więcej", jeśli istnieje
            const oldLoadMoreBtn = document.getElementById(loadMoreBtnId);
            if (oldLoadMoreBtn) oldLoadMoreBtn.remove();

            // Dodaj przycisk "Wczytaj więcej", jeśli są kolejne strony
            if (data.has_next_page) {
                historyPage++;
                if (loaderContainer) loaderContainer.innerHTML = ''; // Ukryj loader, jeśli są kolejne strony
                 listContainer.insertAdjacentHTML('afterend', `<button id="${loadMoreBtnId}" class="btn btn-outline-warning w-100 mt-3" data-year="${currentYear}" data-month="${currentMonth}">Wczytaj więcej</button>`);
                document.getElementById(loadMoreBtnId).addEventListener('click', (e) => {
                    const btn = e.target;
                    loadHistoria(false, btn.dataset.year, btn.dataset.month); // Przekaż filtry
                });
            } else {
                 // Pokaż informację o końcu listy lub braku wyników
                 if (loaderContainer) loaderContainer.innerHTML = historyPage === 1 && data.orders.length === 0 ? '' : '<p class="text-center text-muted mt-3">Koniec listy.</p>';
            }

        } catch (err) {
            console.error("Błąd ładowania historii:", err);
            const loaderContainer = document.getElementById(loaderContainerId);
             if (loaderContainer) loaderContainer.innerHTML = `<div class="alert alert-danger">Błąd ładowania historii: ${err.message}</div>`;
             // Wyczyść listę przy błędzie
             const listContainer = document.getElementById(historyListContainerId);
             if (listContainer) listContainer.innerHTML = '';
        } finally {
             historyLoading = false; // Zezwól na kolejne ładowanie
        }
    }

    function setupCalculatorLogic() {
        // DOM Elements dla kalkulatora
        const calcCategoryFilter = document.getElementById('calcCategoryFilter');
        const calcProductSelector = document.getElementById('calcProductSelector');
        const calcProductOptions = Array.from(calcProductSelector.options);
        const calcProductionPrice = document.getElementById('calcProductionPrice');
        const calcFabricsList = document.getElementById('calc-fabrics-list');
        const calcMaterialsList = document.getElementById('calc-materials-list');
        const calcAddFabricBtn = document.getElementById('calc-add-fabric-btn');
        const calcAddMaterialBtn = document.getElementById('calc-add-material-btn');
        const calcFabricRowTemplate = document.getElementById('calc-fabric-row-template');
        const calcMaterialRowTemplate = document.getElementById('calc-material-row-template');
        const calcFinalPriceEl = document.getElementById('calcFinalPrice');
        const calcFabricCostEl = document.getElementById('calcFabricCost');
        const calcMaterialsCostEl = document.getElementById('calcMaterialsCost');
        const calcProdCostEl = document.getElementById('calcProdCost');
        const calcTotalCostEl = document.getElementById('calcTotalCost');

        // Podstawowa funkcja kalkulacji
        function calculateMobile() {
            let totalFabricCost = 0;
            document.querySelectorAll('.calc-fabric-row').forEach(row => {
                totalFabricCost += (parseFloat(row.dataset.price) || 0) * (parseFloat(row.querySelector('.calc-item-usage').value) || 0);
            });

            let totalMaterialsCost = 0;
            document.querySelectorAll('.calc-material-row').forEach(row => {
                const quantityText = (row.querySelector('.calc-item-usage').value || '0').replace(',', '.');
                const amount = parseFloat(quantityText.match(/(\d+\.?\d*)/)?.[0] || '0'); // Wyciąga liczbę
                totalMaterialsCost += (parseFloat(row.dataset.price) || 0) * amount;
            });

            const rawProdPrice = parseFloat(calcProductionPrice.value) || 0;
            const adjustedProdPrice = rawProdPrice > 0 ? (rawProdPrice * 2.5) + 2 : 0;
            const baseSubtotal = adjustedProdPrice + totalFabricCost + totalMaterialsCost;
            const finalPrice = baseSubtotal * 1.15;

            calcFabricCostEl.textContent = `${totalFabricCost.toFixed(2)} zł`;
            calcMaterialsCostEl.textContent = `${totalMaterialsCost.toFixed(2)} zł`;
            calcProdCostEl.textContent = `${adjustedProdPrice.toFixed(2)} zł`;
            calcTotalCostEl.textContent = `${baseSubtotal.toFixed(2)} zł`;
            calcFinalPriceEl.textContent = `${finalPrice.toFixed(2)} zł`;
        }

        // Aktualizacja ceny wiersza na podstawie wybranego dostawcy
        function updatePriceMobile(row) {
            const itemSelect = row.querySelector('.calc-item-select');
            const supplierSelect = row.querySelector('.calc-supplier-select');
            const itemId = itemSelect.value;
            const itemType = row.classList.contains('calc-fabric-row') ? 'fabrics' : 'materials';
            const itemsData = calculatorData[itemType];
            const item = itemsData[itemId];

            let price = item ? (item.default_price || 0.0) : 0.0;
            if (supplierSelect.value !== "default" && item && item.prices) {
                const supplierPrice = item.prices.find(p => p.supplier_id === parseInt(supplierSelect.value));
                if (supplierPrice) price = supplierPrice.price;
            }
            row.dataset.price = price;
            calculateMobile();
        }

         // Wypełnianie listy dostawców dla wiersza
         function populateSuppliersMobile(row) {
            const itemSelect = row.querySelector('.calc-item-select');
            const supplierSelect = row.querySelector('.calc-supplier-select');
            const itemId = itemSelect.value;
            if (!itemId || itemId === '0') {
                supplierSelect.innerHTML = '<option value="default">-- Dostawca --</option>';
                supplierSelect.disabled = true; updatePriceMobile(row); return;
            }
            const itemType = row.classList.contains('calc-fabric-row') ? 'fabrics' : 'materials';
            const itemsData = calculatorData[itemType];
            const item = itemsData[itemId];
            supplierSelect.innerHTML = '<option value="default" style="font-weight: bold; color: #0d6efd;">-- Domyślna (Ostatnia) --</option>'; // Zmieniono kolor
            if (item && item.prices && item.prices.length > 0) {
                item.prices.forEach(p => {
                    const style = p.is_default ? 'style="font-weight: bold; color: #0d6efd;"' : '';
                    const defaultIndicator = p.is_default ? ' (Ostatnia)' : '';
                    supplierSelect.innerHTML += `<option value="${p.supplier_id}" ${style}>${p.supplier_name}${defaultIndicator} (${p.price.toFixed(2)})</option>`;
                });
                supplierSelect.disabled = false;
            } else { supplierSelect.disabled = true; }
            updatePriceMobile(row); // Przelicz cenę po zmianie produktu/dostawców
        }


        // Tworzenie nowego wiersza tkaniny/materiału
        function createRowMobile(type, itemId = null, usage = null) {
            const template = type === 'fabric' ? calcFabricRowTemplate : calcMaterialRowTemplate;
            const list = type === 'fabric' ? calcFabricsList : calcMaterialsList;
            const newRow = template.content.cloneNode(true).firstElementChild;
            const itemSelect = newRow.querySelector('.calc-item-select');

            const itemsData = calculatorData[type === 'fabric' ? 'fabrics' : 'materials'];
            itemSelect.innerHTML = `<option value="0">-- Wybierz ${type === 'fabric' ? 'tkaninę' : 'materiał'} --</option>`;
            Object.entries(itemsData)
                .sort(([,a], [,b]) => a.name.localeCompare(b.name))
                .forEach(([id, item]) => {
                    itemSelect.innerHTML += `<option value="${id}">${item.name}</option>`;
                });

            if (itemId) itemSelect.value = itemId;
            if (usage) newRow.querySelector('.calc-item-usage').value = usage;

            list.appendChild(newRow);
            // Dodaj listenery do nowego wiersza
            itemSelect.addEventListener('change', () => populateSuppliersMobile(newRow));
            newRow.querySelector('.calc-supplier-select').addEventListener('change', () => updatePriceMobile(newRow));
            newRow.querySelector('.calc-item-usage').addEventListener('input', calculateMobile);
            newRow.querySelector('.calc-remove-btn').addEventListener('click', () => { newRow.remove(); calculateMobile(); });

            if (itemId) populateSuppliersMobile(newRow); // Wypełnij dostawców
        }

        // Ładowanie danych produktu do kalkulatora
        function loadProductDataMobile(productId) {
            calcFabricsList.innerHTML = '';
            calcMaterialsList.innerHTML = '';
            const data = calculatorData.products[productId];

            if (!data || productId === 'custom') {
                calcProductionPrice.value = "0.0";
                createRowMobile('fabric'); // Dodaj pusty wiersz tkaniny, jeśli produkt niestandardowy
            } else {
                calcProductionPrice.value = data.production_price || 0.0;
                (data.fabrics_needed || []).forEach(f => createRowMobile('fabric', f.id, f.usage));
                (data.materials_needed || []).forEach(m => createRowMobile('material', m.id, m.quantity));
                // Jeśli produkt nie ma tkanin, dodaj pusty wiersz
                 if (calcFabricsList.children.length === 0) createRowMobile('fabric');
            }
            calculateMobile(); // Przelicz koszty po załadowaniu danych
        }

        // Filtrowanie listy produktów
        function filterProductsMobile() {
            const selectedCategoryId = calcCategoryFilter.value;
            let isSelectedVisible = false;

            calcProductOptions.forEach(option => {
                const isCustom = option.value === 'custom';
                const productData = calculatorData.products[option.value];
                const categoryId = productData ? String(productData.category_id || 'all') : 'all';
                const isMatch = selectedCategoryId === 'all' || categoryId === selectedCategoryId;
                option.classList.toggle('d-none', !isCustom && !isMatch);
                 if(option.selected && (isMatch || isCustom)) isSelectedVisible = true;
            });

             // Jeśli aktualnie wybrana opcja została ukryta, wybierz "Produkt niestandardowy"
             if (!isSelectedVisible && calcProductSelector.value !== 'custom') {
                 calcProductSelector.value = 'custom';
             }
            loadProductDataMobile(calcProductSelector.value);
        }

        // Event Listeners dla kalkulatora
        calcCategoryFilter.addEventListener('change', filterProductsMobile);
        calcProductSelector.addEventListener('change', () => loadProductDataMobile(calcProductSelector.value));
        calcAddFabricBtn.addEventListener('click', () => createRowMobile('fabric'));
        calcAddMaterialBtn.addEventListener('click', () => createRowMobile('material'));
        calcProductionPrice.addEventListener('input', calculateMobile);

        // Inicjalizacja
        filterProductsMobile(); // Wywołaj filtrowanie i ładowanie danych na starcie
    }

                    categoryButtonsDiv.appendChild(button);
                });
            } catch (err) { categoryButtonsDiv.innerHTML = '<div class="alert alert-danger">Błąd ładowania kategorii.</div>'; }
        }

        // Ładowanie produktów dla kategorii
        async function loadProductsInCategory(categoryId) {
            productListContainer.style.display = 'block';
            productListDiv.innerHTML = '<p>Ładowanie produktów...</p>';
            try {
                const response = await fetch(`/api/admin/products_by_category/${categoryId}`);
                const products = await response.json();
                if (products.length === 0) { productListDiv.innerHTML = '<p class="text-muted">Brak produktów w tej kategorii.</p>'; return; }
                let html = '';
                products.forEach(p => { html += `<a href="#" class="list-group-item list-group-item-action product-select-item" data-product-id="${p.id}" data-product-name="${p.name}">${p.name}</a>`; });
                productListDiv.innerHTML = html;

                // Dodaj listenery do produktów
                document.querySelectorAll('.product-select-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.preventDefault();
                        const productIdValue = item.dataset.productId;
                        if (!productIdValue) {
                            console.error("Błąd krytyczny: Atrybut data-product-id nie został znaleziony!", item);
                            alert("Wystąpił błąd: Nie można zidentyfikować produktu.");
                            return;
                        }
                        currentProductId = productIdValue; // Zapisz ID wybranego produktu
                        selectedProductNameH5.textContent = `Produkt: ${item.dataset.productName}`;
                        categoryFilterStepDiv.style.display = 'none'; // Ukryj wybór kategorii/produktu
                        photoStepDiv.style.display = 'block';      // Pokaż krok zdjęć
                        uploadStatusDiv.innerHTML = '';            // Wyczyść status
                        previewsDiv.innerHTML = '';                // Wyczyść podglądy
                        imagesToUpload = [];                       // Wyczyść listę do wysłania
                        uploadBtn.disabled = true;                 // Zablokuj przycisk wysyłania
                        console.log("Wywołuję loadAndDisplayExistingPhotos z productId:", currentProductId);
                        loadAndDisplayExistingPhotos(currentProductId); // Załaduj istniejące zdjęcia
                    });
                });
            } catch (err) { productListDiv.innerHTML = '<div class="alert alert-danger">Błąd ładowania produktów.</div>'; }
        }

        // Funkcja do ładowania i wyświetlania istniejących zdjęć
        async function loadAndDisplayExistingPhotos(productId) {
             const container = existingPhotosContainer;
             container.innerHTML = '<p class="text-muted small m-2">Ładowanie istniejących zdjęć...</p>';

             try {
                 console.log(`Pobieranie zdjęć dla productId: ${productId} z URL: /api/admin/product/${productId}/images`);
                 const response = await fetch(`/api/admin/product/${productId}/images`);
                 console.log(`Odpowiedź z API: Status ${response.status}`);
                 if (!response.ok) {
                     const errorText = await response.text();
                     console.error(`Błąd API: ${response.status}`, errorText);
                     throw new Error(`Błąd serwera: ${response.status}`);
                 }
                 const imageIds = await response.json();
                 console.log("Otrzymano imageIds:", imageIds);
                 container.innerHTML = '';
                 if (!Array.isArray(imageIds)) {
                     console.error("Błąd: Odpowiedź API nie jest tablicą!", imageIds);
                     throw new Error("Nieprawidłowy format danych z API.");
                 }
                 if (imageIds.length === 0) {
                     console.log("Produkt nie ma jeszcze zdjęć.");
                     container.innerHTML = '<p class="text-muted small m-2">Ten produkt nie ma jeszcze zdjęć.</p>';
                 } else {
                     console.log(`Znaleziono ${imageIds.length} zdjęć. Renderowanie...`);
                     imageIds.forEach(imageId => {
                         console.log(` - Tworzenie img dla imageId: ${imageId}, URL: https://drive.google.com/thumbnail?id=${imageId}&sz=w100`);
                         const imgElement = document.createElement('img');
                         imgElement.src = `https://drive.google.com/thumbnail?id=${imageId}&sz=w100`;
                         imgElement.style.width = '70px';
                         imgElement.style.height = '70px';
                         imgElement.style.objectFit = 'cover';
                         imgElement.style.borderRadius = '5px';
                         imgElement.style.cursor = 'pointer';
                         imgElement.alt = 'Istniejące zdjęcie produktu';
                         imgElement.onerror = () => {
                             console.error(`Nie udało się załadować obrazka z URL: ${imgElement.src}`);
                             imgElement.alt = 'Błąd ładowania';
                         };
                         // Otwieranie obrazka w modalu
                         imgElement.addEventListener('click', () => {
                             const fullImageElement = document.getElementById('fullImage');
                             fullImageElement.src = `https://drive.google.com/thumbnail?id=${imageId}&sz=w1200`; // Większy rozmiar
                             const imageModal = new bootstrap.Modal(document.getElementById('imageModal'));
                             imageModal.show();
                         });
                         container.appendChild(imgElement);
                     });
                     console.log("Zakończono renderowanie zdjęć.");
                 }
             } catch (error) {
                 console.error('Błąd w funkcji loadAndDisplayExistingPhotos:', error);
                 container.innerHTML = `<p class="text-danger small m-2">Błąd ładowania zdjęć: ${error.message}</p>`;
             }
        }

        // Logika dodawania zdjęć
        addPhotoBtn.addEventListener('click', () => { photoInput.click(); });
        photoInput.addEventListener('change', async (event) => {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            addPhotoBtn.disabled = true;
            uploadStatusDiv.innerHTML = '<div class="alert alert-info">Przetwarzanie zdjęć...</div>';
            for (const file of files) {
                try {
                    const processedBlob = await processImage(file, 1080, 1080, 0.9); // Przetwarzanie
                    imagesToUpload.push(processedBlob); // Dodaj do listy do wysłania
                    const previewUrl = URL.createObjectURL(processedBlob);
                    const imgElement = document.createElement('img');
                    imgElement.src = previewUrl;
                    imgElement.style.width = '80px'; imgElement.style.height = '80px'; imgElement.style.objectFit = 'cover'; imgElement.style.borderRadius = '5px';
                    previewsDiv.appendChild(imgElement); // Pokaż podgląd
                } catch (error) {
                    console.error('Błąd przetwarzania obrazu:', error);
                    uploadStatusDiv.innerHTML = `<div class="alert alert-danger">Błąd przetwarzania zdjęcia: ${file.name}.</div>`;
                    addPhotoBtn.disabled = false;
                    return; // Przerwij, jeśli był błąd
                }
            }
            photoInput.value = ''; // Wyczyść input, aby można było dodać te same pliki ponownie
            addPhotoBtn.disabled = false; // Odblokuj przycisk dodawania
            uploadBtn.disabled = imagesToUpload.length === 0; // Odblokuj przycisk wysyłania, jeśli są zdjęcia
            if(imagesToUpload.length > 0) { uploadStatusDiv.innerHTML = `<div class="alert alert-secondary">Gotowe do wysłania ${imagesToUpload.length} zdjęć.</div>`; }
            else { uploadStatusDiv.innerHTML = ''; }
        });

        // Logika wysyłania zdjęć
        uploadBtn.addEventListener('click', async () => {
            if (!currentProductId || imagesToUpload.length === 0) return;
            uploadBtn.disabled = true; backBtn.disabled = true; // Zablokuj przyciski
            uploadStatusDiv.innerHTML = `<div class="alert alert-info">Wysyłanie ${imagesToUpload.length} zdjęć...</div>`;
            const formData = new FormData();
            imagesToUpload.forEach((blob, index) => { formData.append('product_image', blob, `upload_${index + 1}.jpg`); }); // Dodaj przetworzone Bloby
            try {
                const response = await fetch(`/api/admin/product/${currentProductId}/upload_image`, { method: 'POST', body: formData });
                const result = await response.json();
                if (response.ok || response.status === 207) { // 207 Multi-Status, jeśli były częściowe błędy
                    let message = result.message || '';
                    if (result.warning) { message += ` ${result.warning}`; result.errors.forEach(err => message += `<br>- ${err}`); }
                    uploadStatusDiv.innerHTML = `<div class="alert alert-success">${message}</div>`;
                    imagesToUpload = []; previewsDiv.innerHTML = ''; // Wyczyść po wysłaniu
                    loadAndDisplayExistingPhotos(currentProductId); // Odśwież istniejące
                } else { throw new Error(result.error || `Błąd serwera: ${response.status}`); }
            } catch (error) {
                console.error('Błąd wysyłania zdjęć:', error);
                uploadStatusDiv.innerHTML = `<div class="alert alert-danger">Błąd wysyłania: ${error.message}</div>`;
            } finally {
                uploadBtn.disabled = imagesToUpload.length === 0; // Odblokuj tylko, jeśli nie ma już zdjęć
                backBtn.disabled = false; // Zawsze odblokuj powrót
            }
        });

        // Powrót do wyboru kategorii
        backBtn.addEventListener('click', () => {
            photoStepDiv.style.display = 'none';       // Ukryj krok zdjęć
            categoryFilterStepDiv.style.display = 'block'; // Pokaż wybór kategorii/produktu
            currentProductId = null; imagesToUpload = []; previewsDiv.innerHTML = ''; uploadStatusDiv.innerHTML = ''; // Reset
             // Odznacz aktywny przycisk kategorii i schowaj listę produktów
             categoryButtonsDiv.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
             productListContainer.style.display = 'none'; productListDiv.innerHTML = '';
        });

        // Inicjalizacja: Załaduj kategorie
        loadCategories();
    }

    // --- FUNKCJA PRZETWARZANIA OBRAZU ---
    function processImage(file, maxWidth, maxHeight, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; } }
                    else { if (height > maxHeight) { width = Math.round(width * (maxHeight / height)); height = maxHeight; } }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob( (blob) => {
                        if (blob) { console.log(`Obraz przetworzony: ${width}x${height}, rozmiar: ${Math.round(blob.size / 1024)} KB`); resolve(blob); }
                        else { reject(new Error('Nie udało się utworzyć Bloba.')); }
                    }, 'image/jpeg', quality ); // Zapisz jako JPEG z określoną jakością
                };
                img.onerror = (error) => reject(error);
                img.src = event.target.result; // Użyj wyniku readAsDataURL
            };
            reader.onerror = (error) => reject(error);
            reader.readAsDataURL(file); // Wczytaj plik jako Data URL
        });
    }

    // === NOWA FUNKCJA DO SPRAWDZANIA STATUSU SERWERÓW ===
    async function checkServerStatus() {
        try {
            const response = await fetch('/api/desktop_status');
            if (!response.ok) { throw new Error('Błąd sieci'); }
            const data = await response.json();

            // Status serwera druku
            if (data.print_server === 'online') {
                printStatusBadge.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> ONLINE';
                printStatusBadge.className = 'badge bg-light text-success';
            } else {
                printStatusBadge.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i> OFFLINE';
                printStatusBadge.className = 'badge bg-light text-danger';
            }

            // Status serwera synchronizacji
            if (data.sync_server === 'online') {
                syncStatusBadge.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> ONLINE';
                syncStatusBadge.className = 'badge bg-light text-success';
            } else {
                syncStatusBadge.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i> OFFLINE';
                syncStatusBadge.className = 'badge bg-light text-danger';
            }

        } catch (error) {
            console.error("Błąd pobierania statusu serwerów:", error);
            printStatusBadge.innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning"></i> BŁĄD';
            printStatusBadge.className = 'badge bg-light text-warning';
            syncStatusBadge.innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning"></i> BŁĄD';
            syncStatusBadge.className = 'badge bg-light text-warning';
        }
    }
    // === KONIEC NOWEJ FUNKCJI ===

    // --- Inicjalizacja Aplikacji ---
    loadKokpit(); // Załaduj domyślny widok
    // === NOWE WYWOŁANIA FUNKCJI STATUSU ===
    checkServerStatus(); // Sprawdź od razu po załadowaniu
    setInterval(checkServerStatus, 60000); // Sprawdzaj co minutę
    // === KONIEC NOWYCH WYWOŁAŃ ===

    // --- Logika Service Workera ---
    let serviceWorkerRegistration;
    const updateToastElement = document.getElementById('updateToast');
    const updateToast = new bootstrap.Toast(updateToastElement);
    const refreshButton = document.getElementById('refresh-button');

    function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{{ url_for('service_worker') }}")
                .then(registration => {
                    console.log('[PWA] Service Worker zarejestrowany pomyślnie:', registration);
                    serviceWorkerRegistration = registration;
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        if (installingWorker) {
                            console.log('[PWA] Znaleziono nowego Service Workera, instalowanie...');
                            installingWorker.onstatechange = () => {
                                if (installingWorker.state === 'installed') {
                                    if (navigator.serviceWorker.controller) {
                                        console.log('[PWA] Nowy Service Worker zainstalowany. Pokazywanie powiadomienia.');
                                        updateToast.show();
                                    } else { console.log('[PWA] Service Worker zainstalowany po raz pierwszy.'); }
                                }
                            };
                        }
                    };
                })
                .catch(error => { console.log('[PWA] Rejestracja Service Workera nie powiodła się:', error); });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { console.log('[PWA] Kontroler się zmienił, przeładowywanie strony!'); window.location.reload(); refreshing = true; }
            });
        }
    }
    refreshButton.addEventListener('click', () => { console.log('[PWA] Użytkownik kliknął "Odśwież".'); updateToast.hide(); window.location.reload(); });
    registerServiceWorker();

}); // Koniec DOMContentLoaded
    </script>
